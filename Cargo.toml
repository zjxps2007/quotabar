[package]
name = "quotabar"
version = "0.1.4"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]
members = ["native/bridge"]
resolver = "3"

[lib]
path = "native/lib.rs"

[[bin]]
name = "quotabar-statusline"
path = "native/statusline_main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
memchr = "2"
indexmap = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_Graphics_GdiPlus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSPathUtilities", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = "debuginfo"

[package]
name = "quotabar-native"
version = "0.1.4"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
quotabar = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

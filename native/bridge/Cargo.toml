[package]
name = "quotabar-native"
version = "0.1.4"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "staticlib"]

[features]
mac-settings-compat = ["quotabar/mac-settings-compat"]
windows-update-fixture = ["quotabar/windows-update-fixture"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
quotabar = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
zeroize = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
